x-processor: &processor
  build:
    context: ./services/processor
  env_file: ./services/processor/.env.example
  environment:
    POSTGRES_URL: postgresql://admin:admin@postgres:5432/papers_db_v2
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    REDIS_URL: redis://redis:6379
    LLM_BASE_URL: http://ollama:11434
    EMBED_MODEL: bge-m3
    EMBED_BATCH_SIZE: 16
    EMBED_REQUEST_TIMEOUT: 300
    RABBITMQ_PREFETCH: 1
    SEARCH_INDEX_EVERY_N_PAPERS: 25
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    ollama:
      condition: service_healthy
    ollama-init:
      condition: service_completed_successfully
  networks:
    - app-network
  restart: unless-stopped

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  postgres:
    container_name: postgres
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: papers_db_v2
    ports:
      - "5445:5432"
    volumes:
      - postgres_data_v3:/var/lib/postgresql
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./services/postgres/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d papers_db_v2"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - app-network

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_KEEP_ALIVE: -1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-init:
    container_name: ollama_init
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama show gemma4:e2b || ollama pull gemma4:e2b; ollama show bge-m3 || ollama pull bge-m3"
    restart: "no"
    networks:
      - app-network

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  # ── Application Services ─────────────────────────────────────────────────────
  scraper:
    container_name: scraper
    build:
      context: ./services/scraper
    env_file: ./services/scraper/.env.example
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://admin:admin@postgres:5432/papers_db_v2
      ARXIV_PAGE_SIZE: 200
      ARXIV_REQUEST_DELAY: 5.0
      ARXIV_MAX_RETRIES: 6
      ARXIV_MAX_PAGES_PER_RUN: 0
      INITIAL_LOOKBACK_DAYS: 30
      SCRAPER_INTERVAL_SECONDS: 120
      CHECKPOINT_COMMIT_EVERY: 25
      SCRAPER_RESET_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  processor:
    <<: *processor

  processor-2:
    <<: *processor

  processor-3:
    <<: *processor

  keybert-backfill:
    build:
      context: ./services/processor
      dockerfile: Dockerfile.keybert
    environment:
      POSTGRES_URL: postgresql://admin:admin@postgres:5432/papers_db_v2
      KEYBERT_MODEL: BAAI/bge-small-en-v1.5
      KEYBERT_BATCH: 512
      KEYBERT_ENCODE_BATCH: 768
      KEYBERT_FAST_BATCH: 4096
      KEYBERT_DEVICE: cuda
      KEYBERT_FP16: "1"
    volumes:
      - hf_cache:/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - keybert
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    container_name: fastapi
    build:
      context: ./fastapi
    env_file: ./fastapi/.env.example
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://admin:admin@postgres:5432/papers_db_v2
      OLLAMA_BASE_URL: http://ollama:11434
      EMBED_MODEL: bge-m3
      EMBED_DIM: "1024"
      LLM_MODEL: gemma4:e2b
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RERANK_ENABLED: "true"
      RERANK_MODEL: BAAI/bge-reranker-v2-m3
      RERANK_TOP_N: "50"
      RERANK_MIN_SCORE: "0.3"
      HYBRID_CANDIDATE_MULTIPLIER: "20"
      HYBRID_CHILD_RECALL_MIN: "100"
      HYBRID_CHILD_RECALL_MAX: "100"
      ANCHOR_CHILD_QUOTA: "25"
      LLM_CONTEXT_TOP_K: "8"
      SEARCH_RESULT_MAX: "20"
      SELF_RAG_ENABLED: "true"
      SELF_RAG_POST_GEN_ENABLED: "false"
      SELF_RAG_MIN_CONFIDENCE: "0.45"
      PROFILE_RAG_TIMING: "true"
      RERANK_DEVICE: cuda
      RERANK_BATCH_SIZE: "64"
      LLM_MAX_CONTEXT_CHARS: "96000"
      LLM_NUM_CTX: "32768"
      RAG_CHILD_MAX_CHARS: "12000"
      RAG_PARENT_MAX_CHARS: "12000"
      RERANK_MAX_CHARS: "8000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    volumes:
      - hf_cache:/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data_v3:
  hf_cache:
  redis_data:
  minio_data:
  ollama_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
